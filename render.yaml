services:
  - type: web
    name: visualizador-ocupacion-3d-ewm-demo
    runtime: docker
    plan: 1c-2g

    disk:
      name: visualizador-data
      mountPath: /var/data
      sizeGB: 1
      
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ENABLE_UPLOADS
        value: "true"
      - key: DEMO_USERNAME
        value: "gerencia"
      - key: DEMO_PASSWORD
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "20971520"
      - key: DATA_DIR
        value: /var/data
